storageType: filesystem
locale: en
vault: ./vault
features:
  favorites: true
  tasks: true
  pinned: true
  nonDistractionMode: true
  noteWebhook: true
notes:
  trashRetentionDays: 30
editor:
  autosaveDelay: 2000
  assetsFolder: assets
layout:
  showSidebarPanel: true
  showNotesListPanel: true
  sidebarPanelWidth: 300
  notesListPanelWidth: 370
theme:
  accentColor: '#3f57dfff'
  sidebarBackgroundColor: '#fafafa'
  sidebarBadge: '🦄'
  defaultEditorColor: yellow
  typography:
    application:
      typeface: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif
      fontSize: 16px
    editor:
      typeface: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif
      fontSize: 14px
editorColors:
  red:
    emoji: '🔴'
    background: '#F9E7EA'
    text: '#7C212B'
    label: 'Red'
  pink:
    emoji: '🩷'
    background: '#FCE3E6'
    text: '#EB445A'
    label: 'Pink'
  mint:
    emoji: '🟢'
    background: '#EAFAF4'
    text: '#367457'
    label: 'Mint'
  yellow:
    emoji: '🟡'
    background: '#FDF5E8'
    text: '#885D25'
    label: 'Yellow'
  blue:
    emoji: '🔵'
    background: '#E8F0FE'
    text: '#20428D'
    label: 'Blue'
  orange:
    emoji: '🟠'
    background: '#FDF5E8'
    text: '#885D25'
    label: 'Orange'
  purple:
    emoji: '🟣'
    background: '#F6E7FD'
    text: '#691B8D'
    label: 'Purple'
  grey:
    emoji: '⚪️'
    background: '#F5F6F7'
    text: '#606368'
    label: 'Grey'
  brown:
    emoji: '🟤'
    background: '#F2EDE7'
    text: '#4F391A'
    label: 'Brown'
