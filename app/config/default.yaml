storageType: filesystem
locale: en
vault: ./vault
features:
  favorites: true
  tasks: true
  pinned: true
  nonDistractionMode: true
  noteWebhook: true
notes:
  trashRetentionDays: 30
editor:
  autosaveDelay: 2000
  assetsFolder: assets
layout:
  showSidebarPanel: true
  showNotesListPanel: true
  sidebarPanelWidth: 300
  notesListPanelWidth: 370
theme:
  accentColor: '#3f57dfff'
  sidebarBackgroundColor: '#fafafa'
  sidebarTextColor: '#444444'
  sidebarBadge: '🦄'
  defaultEditorColor: yellow
  typography:
    application:
      typeface: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif
      fontSize: 16px
    editor:
      typeface: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif
      fontSize: 14px
editorColors:
  red:
    emoji: '🔴'
    background: '#F9EAE7'
    text: '#C0594E'
    label: 'Red'
  pink: # Apple Notes Color
    emoji: '🩷'
    background: '#FCE3E6'
    text: '#EB445A'
    label: 'Pink'
  mint: # Apple Notes Color
    emoji: '🟢'
    background: '#E6F6F4'
    text: '#5AC5B3'
    label: 'Mint'
  yellow:
    emoji: '🟡'
    background: '#F8F3DE'
    text: '#C39647'
    label: 'Yellow'
  blue: # Apple Notes Color
    emoji: '🔵'
    background: '#E2EDFE'
    text: '#3B86F7'
    label: 'Blue'
  orange: # Apple Notes Color
    emoji: '🟠'
    background: '#FDEFE3'
    text: '#F09343'
    label: 'Orange'
  purple: # Apple Notes Color
    emoji: '🟣'
    background: '#F5E2F9'
    text: '#BB3ED9'
    label: 'Purple'
  grey:
    emoji: '⚪️'
    background: '#F0EFED'
    text: '#7C7A76'
    label: 'Grey'
  brown:
    emoji: '🟤'
    background: '#F4EDE9'
    text: '#99785E'
    label: 'Brown'
